name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno Java JDK (Ajusta la versión si usas Java 17 u otra)
      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Dar permisos de ejecución al wrapper de Maven (opcional pero recomendado)
      - name: Dar permisos de ejecución a mvnw
        run: chmod +x mvnw

      # 4. Compilar el proyecto y ejecutar los tests unitarios con JaCoCo
      - name: Compilar y ejecutar pruebas con Maven
        run: ./mvnw clean test

      # 5. Subir el reporte de cobertura HTML como artefacto de GitHub
      - name: Subir reporte de JaCoCo como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - run: chmod +x mvnw

      - run: ./mvnw clean test
